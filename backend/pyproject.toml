[project]
name = "smart-pokedex-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "joblib>=1.4,<2", "httpx>=0.27,<1"]


[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]
gemini = ["google-genai>=1.0,<2"]
notebooks = ["jupyter>=1.0", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "pandas>=2.2", "matplotlib>=3.9", "nltk>=3.9", "requests>=2.32"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

